[project]
authors = [{name = "harm-nomden-sweco", email = "harm.nomden@sweco.nl"}]
name = "WRIJ_RR_Unpaved_methode"
requires-python = "==3.11.*"
version = "0.1.0"
dependencies = ["hydrolib==0.5.0", "hkvsobekpy>=1.5,<2", "asyncio>=4.0.0,<5"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
wrij_rr_unpaved_methode = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pyogrio = ">=0.9.0,<0.10.0"
gdal = "*"
fire = "*"
geopandas = ">=1.1.3,<2"
pandas = ">=1.2,<3.0"
rioxarray = ">=0.19.0,<0.20"
imod = ">=1.0.0.post1,<2"
plotly = ">=6.8.0,<7"

