[project]
authors = [{name = "harm-nomden-sweco", email = "harm.nomden@sweco.nl"}]
name = "WRIJ_RR_Unpaved_methode"
requires-python = ">= 3.10"
version = "0.1.0"
dependencies = ["hydrolib==0.5.0"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
wrij_rr_unpaved_methode = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pandas = "==2.3.3"
geopandas = ">=1.1.3,<2"
shapely = ">=2.1.2,<3"
pyproj = ">=3.7.2,<4"
fiona = ">=1.10.1,<2"
